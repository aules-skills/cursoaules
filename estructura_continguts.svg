<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Estructura de continguts d'un curs Aules generat per la skill</title>
<desc>Un curs conte una seccio General amb un forum d'anuncis, i una seccio per cada tema. Cada seccio de tema conte una etiqueta oculta amb notes pedagogiques nomes visibles pel professorat, i tres activitats Practica publiques, cadascuna amb una rubrica de 4 nivells.</desc>

<rect x="240" y="30" width="200" height="60" rx="8" fill="#1E3A5F"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#FFFFFF">Curs Aules (.mbz)</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#CBD5E1">seccions organitzades per tema</text>

<path d="M340 90 L340 120 M150 120 L340 120 M150 120 L150 150" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
<path d="M450 120 L450 150" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
<path d="M340 120 L450 120" stroke="#94A3B8" stroke-width="1.5" fill="none"/>

<rect x="60" y="150" width="180" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="150" y="174" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1E3A8A">Seccio 0 - General</text>
<text x="150" y="196" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#2563EB">fixa, una sola vegada</text>

<rect x="280" y="150" width="340" height="64" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="450" y="174" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1E3A8A">Seccio N - Tema N</text>
<text x="450" y="196" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#2563EB">es repeteix per a cada tema del curs</text>

<path d="M150 214 L150 300" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
<path d="M450 214 L450 270 M304 270 L596 270 M304 270 L304 300 M401 270 L401 300 M498 270 L498 300 M596 270 L596 300" stroke="#94A3B8" stroke-width="1.5" fill="none"/>

<rect x="60" y="300" width="180" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
<text x="150" y="325" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#374151">Forum - Anuncis</text>

<rect x="263" y="300" width="83" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="304.5" y="322" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#78350F">Etiqueta</text>
<text x="304.5" y="338" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#78350F">(oculta)</text>
<text x="304.5" y="356" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#92400E">nomes professorat</text>

<rect x="360" y="300" width="83" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="401.5" y="325" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#14532D">Practica #1</text>
<text x="401.5" y="345" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#166534">rubrica 4 nivells</text>

<rect x="457" y="300" width="83" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="498.5" y="325" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#14532D">Practica #2</text>
<text x="498.5" y="345" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#166534">rubrica 4 nivells</text>

<rect x="554" y="300" width="83" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="595.5" y="325" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="500" fill="#14532D">Practica #3</text>
<text x="595.5" y="345" text-anchor="middle" dominant-baseline="central" font-size="9.5" fill="#166534">rubrica 4 nivells</text>

<text x="340" y="400" text-anchor="middle" dominant-baseline="central" font-size="11" font-style="italic" fill="#6B7280">Aquest patro (etiqueta oculta + N practiques) es genera igual per a cada tema del curs</text>
</svg>
