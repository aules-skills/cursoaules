<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Estructura del llibre de qualificacions per competencia i criteri</title>
<desc>El curs es divideix en categories per competencia especifica amb pes igual entre elles, i cada competencia es divideix en criteris d'avaluacio amb pes igual entre ells. El primer criteri de cada parella rep la nota directament de la practica corregida; el segon criteri es un element manual que el professorat omple a ma.</desc>

